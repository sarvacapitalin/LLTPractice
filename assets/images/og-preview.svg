      <text x="24" y="44" font-size="26">📋</text>
      <text x="64" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">412 Questions</text>
