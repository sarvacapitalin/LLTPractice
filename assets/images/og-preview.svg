    <text x="35" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">OFFICIAL STALL 2026 SIMULATOR</text>
  </g>

  <!-- Main Title -->
