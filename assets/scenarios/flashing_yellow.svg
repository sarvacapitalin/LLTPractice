<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <!-- Yellow Glow Filter -->
    <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="grad-amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
  </defs>

  <!-- Background Signal Head Housing -->
  <rect x="35" y="15" width="90" height="150" rx="18" fill="#1E293B" stroke="#0F172A" stroke-width="4" />
  <rect x="39" y="19" width="82" height="142" rx="14" fill="#334155" />

  <!-- Signal Visor Hood -->
  <path d="M 45 65 A 35 35 0 0 1 115 65 Z" fill="#0F172A" opacity="0.5" />

  <!-- Inactive Top (Red) Light -->
  <circle cx="80" cy="50" r="14" fill="#475569" stroke="#1E293B" stroke-width="2" opacity="0.4" />

  <!-- Active Flashing Amber / Yellow Light -->
  <!-- Outer Glow Pulse -->
  <circle cx="80" cy="90" r="30" fill="#FBBF24" opacity="0.25" filter="url(#glow-amber)" />
  <circle cx="80" cy="90" r="24" fill="#FBBF24" opacity="0.4" />
  <!-- Main Lamp Core -->
  <circle cx="80" cy="90" r="18" fill="url(#grad-amber)" stroke="#F59E0B" stroke-width="2.5" filter="url(#glow-amber)" />
  <circle cx="75" cy="85" r="5" fill="#FFFBEB" opacity="0.8" />

  <!-- Inactive Bottom (Green) Light -->
  <circle cx="80" cy="130" r="14" fill="#475569" stroke="#1E293B" stroke-width="2" opacity="0.4" />

  <!-- Mounting Pole -->
  <rect x="74" y="165" width="12" height="30" fill="#64748B" stroke="#334155" stroke-width="2" />
  
  <!-- Flashing Radiance Rays -->
  <line x1="45" y1="90" x2="25" y2="90" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  <line x1="115" y1="90" x2="135" y2="90" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  <line x1="55" y1="65" x2="40" y2="50" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  <line x1="105" y1="65" x2="120" y2="50" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  <line x1="55" y1="115" x2="40" y2="130" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
  <line x1="105" y1="115" x2="120" y2="130" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
</svg>