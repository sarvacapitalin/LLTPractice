<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <defs>
    <!-- Red Glow Filter -->
    <filter id="glow-red" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="grad-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FECACA" />
      <stop offset="40%" stop-color="#EF4444" />
      <stop offset="85%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </radialGradient>
  </defs>

  <!-- Background Signal Head Housing -->
  <rect x="35" y="15" width="90" height="150" rx="18" fill="#1E293B" stroke="#0F172A" stroke-width="4" />
  <rect x="39" y="19" width="82" height="142" rx="14" fill="#334155" />

  <!-- Signal Visor Hood -->
  <path d="M 45 25 A 35 35 0 0 1 115 25 Z" fill="#0F172A" opacity="0.5" />

  <!-- Active Flashing Top (Red) Light -->
  <!-- Outer Glow Pulse -->
  <circle cx="80" cy="50" r="30" fill="#EF4444" opacity="0.25" filter="url(#glow-red)" />
  <circle cx="80" cy="50" r="24" fill="#EF4444" opacity="0.4" />
  <!-- Main Lamp Core -->
  <circle cx="80" cy="50" r="18" fill="url(#grad-red)" stroke="#DC2626" stroke-width="2.5" filter="url(#glow-red)" />
  <circle cx="75" cy="45" r="5" fill="#FEF2F2" opacity="0.8" />

  <!-- Inactive Middle (Amber) Light -->
  <circle cx="80" cy="90" r="14" fill="#475569" stroke="#1E293B" stroke-width="2" opacity="0.4" />

  <!-- Inactive Bottom (Green) Light -->
  <circle cx="80" cy="130" r="14" fill="#475569" stroke="#1E293B" stroke-width="2" opacity="0.4" />

  <!-- Mounting Pole -->
  <rect x="74" y="165" width="12" height="30" fill="#64748B" stroke="#334155" stroke-width="2" />
  
  <!-- Flashing Radiance Rays -->
  <line x1="45" y1="50" x2="25" y2="50" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
  <line x1="115" y1="50" x2="135" y2="50" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
  <line x1="55" y1="25" x2="40" y2="10" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
  <line x1="105" y1="25" x2="120" y2="10" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
  <line x1="55" y1="75" x2="40" y2="90" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
  <line x1="105" y1="75" x2="120" y2="90" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
</svg>